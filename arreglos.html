<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5. Arreglos (10 países)</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>5. Arreglos (10 países)</h1><nav>
<a href="index.html">Inicio</a><a href="voto.html">1. Votación</a><a href="suma.html">2. Suma</a><a href="condicionales.html">3. If-else/Switch</a><a href="ciclos.html">4. While/For</a><a href="arreglos.html">5. Arreglos</a><a href="estilos.html">6. Menú/Form</a>
</nav></header><main>
<div class="card"><h2>Arreglo actual</h2>
<div class="arr" id="arr"></div><div class="out" id="info"></div>
<button data-accion="reiniciar">Reiniciar arreglo</button></div>
<div class="card"><h3>Valores / posiciones</h3>
<label>País (push, unshift, splice, concat)</label><input id="pais" placeholder="Ej. Chile">
<label>Posición (splice, delete)</label><input id="pos" type="number" min="0" value="2">
<label>Separador (join)</label><input id="sep" value=" - " style="max-width:120px"></div>
<div class="card"><h3>Métodos</h3>
<button data-accion="metodo" data-op="pop">pop</button><button data-accion="metodo" data-op="shift">shift</button>
<button data-accion="metodo" data-op="push">push</button><button data-accion="metodo" data-op="unshift">unshift</button>
<button data-accion="metodo" data-op="splice">splice</button><button data-accion="metodo" data-op="delete">delete</button>
<button data-accion="metodo" data-op="reverse">reverse</button><button data-accion="metodo" data-op="sort">sort</button>
<button data-accion="metodo" data-op="concat">concat</button><button data-accion="metodo" data-op="join">join</button>
<button data-accion="metodo" data-op="length">length</button></div>
</main><script src="script.js"></script>
</body></html>
